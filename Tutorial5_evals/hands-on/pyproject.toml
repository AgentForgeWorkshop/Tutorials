[project]
name = "microplastics-eval-tutorial"
version = "0.1.0"
description = "Tutorial 5 hands-on: evaluating a paper-triage agent (Example 1)"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "langchain==1.4.2",
    "langchain-openai==1.6.2",
    "langsmith==0.14.17",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pandas>=2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
