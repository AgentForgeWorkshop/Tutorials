name: Tutorial 3 tests
on:
  push:
    paths: ["Tutorial3_mcp_skills/**", ".github/workflows/tutorial3-tests.yml"]
  pull_request:
    paths: ["Tutorial3_mcp_skills/**", ".github/workflows/tutorial3-tests.yml"]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: Tutorial3_mcp_skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
